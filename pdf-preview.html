<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF Preview</title>
  <style>
    html, body { margin: 0; background: #f4f8fd; }
    body { display: grid; place-items: start center; padding: 24px; }
    canvas { width: min(1200px, calc(100vw - 48px)); height: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.12); border-radius: 12px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
  <canvas id="page"></canvas>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const url = 'Atharva%20file%20pdf.pdf';
    const loadingTask = pdfjsLib.getDocument(url);
    loadingTask.promise.then(async (pdf) => {
      const page = await pdf.getPage(1);
      const viewport = page.getViewport({ scale: 2.0 });
      const canvas = document.getElementById('page');
      const context = canvas.getContext('2d');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      await page.render({ canvasContext: context, viewport }).promise;
    }).catch((error) => {
      document.body.innerHTML = '<pre style="white-space:pre-wrap;color:#b00">' + error.message + '</pre>';
    });
  </script>
</body>
</html>
